<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Animation Weather</title>
    <style>
        body { margin: 0; font-family: Arial; overflow: hidden; height: 100vh; display: flex; justify-content: center; align-items: center; color: white; transition: background 1.5s ease; }
        #anim-layer { position: absolute; top:0; left:0; width:100%; height:100%; z-index: -1; }
        .card { width: 350px; background: rgba(0,0,0,0.4); padding: 25px; border-radius: 20px; text-align: center; backdrop-filter: blur(10px); }
        input { width: 80%; padding: 10px; border-radius: 10px; border: none; outline: none; }
        button { margin-top: 15px; padding: 10px 20px; background: #ff9800; border: none; border-radius: 10px; color: white; cursor: pointer; font-weight: bold; }
        .drop { position: absolute; background: #00aaff; width: 2px; height: 15px; animation: fall linear infinite; }
        .cloud { position: absolute; background: white; border-radius: 50%; opacity: 0.8; }
        @keyframes fall { to { transform: translateY(100vh); } }
    </style>
</head>
<body>

<div id="anim-layer"></div>

<div class="card">
    <h2>Search Weather</h2>
    <input type="text" id="city" placeholder="Enter location name...">
    <br>
    <button onclick="getWeather()">Search Weather</button>
    <div id="result" style="margin-top:20px;"></div>
</div>

<script>
async function getWeather() {
    const city = document.getElementById('city').value;
    const resEl = document.getElementById('result');
    
    try {
        // Geocoding
        let geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=tr`).then(r => r.json());
        if (!geo.results) { resEl.innerText = "Location Not Found!"; return; }
        
        const { latitude, longitude, name } = geo.results[0];
        
        // Weather
        let weather = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current=temperature_2m,weather_code,wind_speed_10m`).then(r => r.json());
        const cur = weather.current;
        const code = cur.weather_code;

        resEl.innerHTML = `<strong>${name}</strong><br>Sıcaklık: ${cur.temperature_2m}°C<br>Rüzgar: ${cur.wind_speed_10m} km/s`;
        
        setAnimation(code);
    } catch (e) { resEl.innerText = "Error!"; }
}

function setAnimation(code) {
    const layer = document.getElementById('anim-layer');
    layer.innerHTML = "";
    let bg = "#1e3c72";

    if ([61, 63, 65, 80, 81, 82].includes(code)) { // Yağmur
        bg = "#2c3e50";
        for(let i=0; i<40; i++) {
            let d = document.createElement('div');
            d.className = 'drop';
            d.style.left = Math.random()*100 + "%";
            d.style.animationDuration = (Math.random()+0.5) + "s";
            layer.appendChild(d);
        }
    } else if ([3, 45, 48].includes(code)) { // Bulutlu
        bg = "#3a6073";
        for(let i=0; i<5; i++) {
            let c = document.createElement('div');
            c.className = 'cloud';
            c.style.width = "100px"; c.style.height = "50px";
            c.style.left = Math.random()*80 + "%"; c.style.top = Math.random()*30 + "%";
            layer.appendChild(c);
        }
    } else { bg = "#1e3c72"; } // Güneşli
    
    document.body.style.background = bg;
}
</script>
</body>
</html>
