<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    height:100vh;
    overflow:hidden;
}

.window{
    width:400px;
    background:#111827;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 0 50px rgba(0,0,0,.5);
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

.titlebar{
    height:42px;
    background:#1f2937;
    display:flex;
    align-items:center;
    padding-left:15px;
    color:white;
    font-size:14px;
}

.display{
    width:100%;
    height:90px;
    border:none;
    outline:none;
    background:#0f172a;
    color:#00ff88;
    text-align:right;
    font-size:38px;
    padding-right:20px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    padding:10px;
}

button{
    height:70px;
    border:none;
    border-radius:12px;
    background:#374151;
    color:white;
    font-size:24px;
    cursor:pointer;
}

button:hover{
    transform:scale(1.03);
}

.op{
    background:#2563eb;
}

.eq{
    background:#10b981;
}

.clear{
    background:#dc2626;
}

.taskbar{
    position:fixed;
    bottom:0;
    width:100%;
    height:50px;
    background:rgba(0,0,0,.45);
    backdrop-filter:blur(15px);
    display:flex;
    justify-content:flex-end;
    align-items:center;
    padding-right:15px;
    color:white;
}

.clock{
    font-size:15px;
}
</style>
</head>
<body>

<div class="window">

<div class="titlebar">
🖩 Calculator
</div>

<input id="display" class="display" readonly>

<div class="buttons">

<button class="clear" onclick="clr()">C</button>
<button onclick="add('(')">(</button>
<button onclick="add(')')">)</button>
<button class="op" onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="op" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="op" onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="op" onclick="add('+')">+</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button class="eq" style="grid-column:span 2;" onclick="calc()">=</button>

</div>
</div>

<div class="taskbar">
<div class="clock" id="clock"></div>
</div>

<script>
function add(v){
 document.getElementById("display").value += v;
}

function clr(){
 document.getElementById("display").value = "";
}

function calc(){
 try{
  document.getElementById("display").value =
  eval(document.getElementById("display").value);
 }catch{
  document.getElementById("display").value = "HATA";
 }
}

function updateClock(){
 const now = new Date();
 document.getElementById("clock").innerHTML =
 now.toLocaleTimeString("tr-TR");
}

setInterval(updateClock,1000);
updateClock();
</script>

</body>
</html>
