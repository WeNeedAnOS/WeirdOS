<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad PRO</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#111;
    color:white;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
    padding:10px;
    background:#1e1e1e;
}

button{
    padding:8px 12px;
    border:none;
    cursor:pointer;
    border-radius:6px;
    font-size:14px;
}

button:hover{
    opacity:0.8;
}

textarea{
    width:100%;
    height:70vh;
    padding:15px;
    font-size:16px;
    border:none;
    outline:none;
    resize:none;
    background:#000;
    color:#0f0;
}

.info{
    padding:10px;
    font-size:14px;
    background:#1e1e1e;
}

.light textarea{
    background:white;
    color:black;
}

.light body{
    background:white;
    color:black;
}
</style>
</head>

<body>

<div class="toolbar">
    <button onclick="newFile()">🧹 New</button>
    <button onclick="saveFile()">💾 Save</button>
    <button onclick="document.getElementById('fileInput').click()">📂 Aç</button>
    <button onclick="undo()">↩️ Back</button>
    <button onclick="redo()">↪️ Go</button>
    <button onclick="toggleTheme()">🌙 Theme</button>
</div>

<input type="file" id="fileInput" style="display:none" onchange="openFile(event)">

<textarea id="editor"></textarea>

<div class="info">
    <span id="stats">0 word | 0 letter</span>
</div>

<script>
let editor = document.getElementById("editor");
let history = [""];
let index = 0;

// yazı değişimi
editor.addEventListener("input", ()=>{
    history = history.slice(0,index+1);
    history.push(editor.value);
    index++;

    updateStats();
});

function newFile(){
    editor.value = "";
    history = [""];
    index = 0;
    updateStats();
}

function saveFile(){
    let blob = new Blob([editor.value], {type:"text/plain"});
    let a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "notlar.txt";
    a.click();
}

function openFile(event){
    let file = event.target.files[0];
    let reader = new FileReader();

    reader.onload = function(){
        editor.value = reader.result;
        history = [editor.value];
        index = 0;
        updateStats();
    }

    reader.readAsText(file);
}

function undo(){
    if(index > 0){
        index--;
        editor.value = history[index];
    }
}

function redo(){
    if(index < history.length-1){
        index++;
        editor.value = history[index];
    }
}

function toggleTheme(){
    document.body.classList.toggle("light");
}

function updateStats(){
    let text = editor.value;
    let words = text.trim().split(/\s+/).filter(w=>w.length>0).length;
    let chars = text.length;
    document.getElementById("stats").innerText = words + " word | " + chars + " letter";
}

// klavye kısayolları
document.addEventListener("keydown", function(e){
    if(e.ctrlKey && e.key === "s"){
        e.preventDefault();
        saveFile();
    }
});
</script>

</body>
</html>
