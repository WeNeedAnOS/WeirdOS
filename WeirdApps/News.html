<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Haber Merkezi</title>
<style>
body{
    font-family:Segoe UI,sans-serif;
    background:#f4f4f4;
    margin:20px;
}
h1{
    text-align:center;
}
.haber{
    background:white;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}
a{
    text-decoration:none;
    color:#0066cc;
}
</style>
</head>
<body>

<h1>📰 Güncel Haberler</h1>

<div id="haberler">Yükleniyor...</div>

<script>
const rss =
"https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/news/rss.xml";

fetch(rss)
.then(r=>r.json())
.then(data=>{
    let html = "";

    data.items.slice(0,15).forEach(haber=>{
        html += `
        <div class="haber">
            <h3>${haber.title}</h3>
            <a href="${haber.link}" target="_blank">
                Haberi Oku
            </a>
        </div>`;
    });

    document.getElementById("haberler").innerHTML = html;
})
.catch(()=>{
    document.getElementById("haberler").innerHTML =
    "Haberler yüklenemedi.";
});
</script>

</body>
</html>
